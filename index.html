<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asilbek AI - Sun'iy Intellekt</title>
    <!-- Outfit Font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Marked.js Markdown Parser CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #020617;
            --surface-color: rgba(30, 41, 59, 0.45);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-accent: #00f2fe;
            --secondary-accent: #4facfe;
            --success-color: #10b981;
            --user-bubble-bg: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --assistant-bubble-bg: rgba(30, 41, 59, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, var(--bg-color) 100%);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* App Layout */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* SIDEBAR STYLING */
        .sidebar {
            width: 320px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-brand {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-brand h2 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-accent) 0%, var(--secondary-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.15));
        }

        .sidebar-brand p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 5px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .premium-card {
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
        }

        .premium-card b {
            color: var(--primary-accent);
        }

        .settings-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .control-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .select-input, .range-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .select-input:focus {
            border-color: var(--primary-accent);
        }

        .range-value {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: auto;
        }

        .btn-clear:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            transform: translateY(-1px);
        }

        /* MAIN CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 24px;
            position: relative;
        }

        /* HEADER */
        .header-container {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.8s ease-out;
            flex-shrink: 0;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-logo {
            font-size: 36px;
            filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.4));
        }

        .header-text h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-accent) 0%, var(--secondary-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            color: var(--success-color);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success-color);
            animation: pulse 2.0s infinite;
        }

        /* CHAT MESSAGE VIEWPORT */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 10px 30px 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-row {
            display: flex;
            width: 100%;
            animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.assistant {
            justify-content: flex-start;
        }

        .chat-message {
            max-width: 75%;
            padding: 16px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            line-height: 1.5;
            font-size: 15.5px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .chat-message.user {
            background: var(--user-bubble-bg);
            color: #ffffff;
            border-bottom-right-radius: 2px;
            border: 1px solid rgba(37, 99, 235, 0.3);
        }

        .chat-message.assistant {
            background: var(--assistant-bubble-bg);
            color: var(--text-primary);
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .chat-message.assistant:hover {
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.06);
        }

        .msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
            margin-bottom: 6px;
        }

        .msg-text p {
            margin-bottom: 10px;
        }
        .msg-text p:last-child {
            margin-bottom: 0;
        }
        
        /* Markdown Code Styles */
        .msg-text pre {
            background: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .msg-text code {
            font-family: 'Courier New', Courier, monospace;
            background: rgba(15, 23, 42, 0.5);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 14px;
        }
        .msg-text pre code {
            background: none;
            padding: 0;
            border-radius: 0;
            font-size: 13.5px;
        }

        /* INPUT AREA */
        .input-container {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            margin-top: 15px;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 16px;
            padding: 8px 5px;
            resize: none;
            height: 38px;
            max-height: 100px;
        }

        .chat-input::placeholder {
            color: var(--text-secondary);
        }

        .btn-send {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary-accent) 0%, var(--secondary-accent) 100%);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: transform 0.2s, opacity 0.2s;
            color: #020617;
            font-size: 18px;
            font-weight: 700;
        }

        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.5);
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        .btn-send:disabled {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border-color);
            box-shadow: none;
            cursor: not-allowed;
            color: var(--text-secondary);
        }

        /* TYPING LOADER */
        .typing-loader {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
        }

        .typing-loader span {
            width: 7px;
            height: 7px;
            background-color: var(--primary-accent);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-loader span:nth-child(1) { animation-delay: -0.32s; }
        .typing-loader span:nth-child(2) { animation-delay: -0.16s; }

        /* MOBILE SIDEBAR TOGGLE BUTTON */
        .sidebar-toggle {
            display: none;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            z-index: 200;
        }

        /* ANIMATIONS */
        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* RESPONSIVENESS */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
            }
            
            .sidebar.active {
                transform: translateX(0);
            }

            .sidebar-toggle {
                display: block;
                margin-right: 12px;
            }

            .header-container {
                padding: 12px 16px;
                border-radius: 14px;
            }

            .header-logo {
                font-size: 28px;
            }

            .header-text h1 {
                font-size: 18px;
            }

            .chat-area {
                padding: 15px;
            }

            .chat-message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <h2>Asilbek AI</h2>
                <p>Llama 3.1 & Vercel</p>
            </div>
            
            <div class="premium-card">
                <b>🇺🇿 Til:</b> O'zbek tili<br>
                <b>🗣️ Shaxsiyat:</b> Virtual yordamchi<br>
                <b>🌍 Platforma:</b> Vercel Edge Serverless
            </div>
            
            <div class="settings-title">⚙️ Sozlamalar</div>
            
            <div class="control-group">
                <label class="control-label" for="modelSelect">SI Modeli</label>
                <select class="select-input" id="modelSelect">
                    <option value="llama-3.1-8b-instant" selected>llama-3.1-8b-instant (Tezkor)</option>
                    <option value="llama-3.1-70b-versatile">llama-3.1-70b-versatile (Aqlli)</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label" for="tempRange">Kreativlik (Temperature)</label>
                <input class="range-input" type="range" id="tempRange" min="0" max="1" step="0.1" value="0.7">
                <div class="range-value">
                    <span>Konservativ</span>
                    <span id="tempValue">0.7</span>
                    <span>Ijodiy</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label" for="tokenRange">Max Tokens</label>
                <input class="range-input" type="range" id="tokenRange" min="256" max="4096" step="128" value="2048">
                <div class="range-value">
                    <span>Qisqa</span>
                    <span id="tokenValue">2048</span>
                    <span>Uzun</span>
                </div>
            </div>

            <button class="btn-clear" id="btnClearChat">
                🗑️ Chatni tozalash
            </button>
        </aside>

        <!-- MAIN CHAT PANEL -->
        <main class="chat-area">
            <!-- Header -->
            <div class="header-container">
                <div class="header-info">
                    <button class="sidebar-toggle" id="sidebarToggle">☰</button>
                    <div class="header-logo">🤖</div>
                    <div class="header-text">
                        <h1>Asilbek AI</h1>
                        <p>O'zbek tilidagi aqlli sun'iy intellekt assistenti</p>
                    </div>
                </div>
                <div class="status-badge">
                    <div class="pulse-dot"></div>
                    Online
                </div>
            </div>

            <!-- Messages Viewport -->
            <div class="messages-container" id="messagesContainer">
                <!-- Messages will be injected here dynamically -->
            </div>

            <!-- Input Area -->
            <div class="input-container">
                <textarea class="chat-input" id="chatInput" placeholder="Asilbek AI ga savol bering..." rows="1"></textarea>
                <button class="btn-send" id="btnSend" disabled>➔</button>
            </div>
        </main>
    </div>

    <script>
        // DOM References
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const messagesContainer = document.getElementById('messagesContainer');
        const chatInput = document.getElementById('chatInput');
        const btnSend = document.getElementById('btnSend');
        const modelSelect = document.getElementById('modelSelect');
        const tempRange = document.getElementById('tempRange');
        const tempValue = document.getElementById('tempValue');
        const tokenRange = document.getElementById('tokenRange');
        const tokenValue = document.getElementById('tokenValue');
        const btnClearChat = document.getElementById('btnClearChat');

        // Chat State
        let chatHistory = [];
        const SYSTEM_PROMPT = 
            "Sizning ismingiz - Asilbek. Siz foydalanuvchilarga har qanday mavzuda yordam beradigan " +
            "juda aqlli, xushmuomala, muloyim va do'stona sun'iy intellekt yordamchisiz.\n\n" +
            "MUHIM MULOQOT QOIDALARI:\n" +
            "1. Siz FAQAT va FAQAT O'ZBEK TILIDA gapirishingiz shart. Boshqa tillarda yozilgan har qanday savolga ham " +
            "muloyimlik bilan faqat o'zbek tilida yordam bera olishingizni tushuntiring va muloqotni o'zbek tilida olib boring.\n" +
            "2. Foydalanuvchiga har doim hurmat bilan, 'Siz' deb muloqot qiling.\n" +
            "3. Javoblaringiz aniq, batafsil, imlo qoidalariga rioya qilgan holda va chiroyli formatlangan (Markdown jadvallari, " +
            "ro'yxatlari yoki kod bloklari orqali) bo'lishi lozim.\n" +
            "4. Hech qachon o'zingiz bilmagan ma'lumotlarni to'qimang.";

        // Toggle mobile sidebar
        sidebarToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.classList.toggle('active');
        });

        document.body.addEventListener('click', () => {
            sidebar.classList.remove('active');
        });

        sidebar.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Update range indicators
        tempRange.addEventListener('input', (e) => {
            tempValue.textContent = e.target.value;
        });

        tokenRange.addEventListener('input', (e) => {
            tokenValue.textContent = e.target.value;
        });

        // Input button state control
        chatInput.addEventListener('input', (e) => {
            btnSend.disabled = e.target.value.trim().length === 0;
            // Auto resize input height
            e.target.style.height = 'auto';
            e.target.style.height = (e.target.scrollHeight) + 'px';
        });

        // Clear chat
        btnClearChat.addEventListener('click', () => {
            chatHistory = [];
            messagesContainer.innerHTML = '';
            showWelcomeMessage();
            alert("Chat muvaffaqiyatli tozalandi!");
        });

        // Render Message Helper
        function appendMessage(role, text) {
            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            
            const message = document.createElement('div');
            message.className = `chat-message ${role}`;
            
            const header = document.createElement('div');
            header.className = 'msg-header';
            header.innerHTML = role === 'user' ? '👤 Siz' : '🤖 Asilbek AI';
            
            const body = document.createElement('div');
            body.className = 'msg-text';
            
            // Format markdown using Marked.js
            body.innerHTML = marked.parse(text);
            
            message.appendChild(header);
            message.appendChild(body);
            row.appendChild(message);
            messagesContainer.appendChild(row);
            
            // Auto-scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Render Typing Loader
        function showLoader() {
            const row = document.createElement('div');
            row.className = 'message-row assistant';
            row.id = 'loaderRow';
            
            const message = document.createElement('div');
            message.className = 'chat-message assistant';
            
            const header = document.createElement('div');
            header.className = 'msg-header';
            header.innerHTML = '🤖 Asilbek AI';
            
            const body = document.createElement('div');
            body.className = 'msg-text';
            body.innerHTML = `
                <div class="typing-loader">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            
            message.appendChild(header);
            message.appendChild(body);
            row.appendChild(message);
            messagesContainer.appendChild(row);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeLoader() {
            const loader = document.getElementById('loaderRow');
            if (loader) loader.remove();
        }

        // Welcome Message
        function showWelcomeMessage() {
            appendMessage('assistant', "Salom! Mening ismim **Asilbek**. Men sizning o'zbek tilidagi aqlli sun'iy intellekt yordamchingizman. Bugun sizga qanday yordam bera olaman? 😊");
        }

        // Send message to Serverless API
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Display user message and clear inputs
            appendMessage('user', text);
            chatInput.value = '';
            chatInput.style.height = '38px';
            btnSend.disabled = true;

            // Save to state history
            chatHistory.push({ role: "user", content: text });

            // Display typing animation
            showLoader();

            // Prepare API body
            const payloadMessages = [
                { role: "system", content: SYSTEM_PROMPT },
                ...chatHistory
            ];

            try {
                // Fetch response from Vercel Serverless api/chat
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: payloadMessages,
                        model: modelSelect.value,
                        temperature: parseFloat(tempRange.value),
                        max_tokens: parseInt(tokenRange.value)
                    })
                });

                removeLoader();

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || "Server muloqotida muammo yuz berdi.");
                }

                const data = await response.json();
                const assistantReply = data.choices[0].message.content;

                // Show response
                appendMessage('assistant', assistantReply);
                chatHistory.push({ role: "assistant", content: assistantReply });

            } catch (error) {
                removeLoader();
                console.error(error);
                appendMessage('assistant', `⚠️ **Kechirasiz, xatolik yuz berdi:** ${error.message}\n\nIltimos, Vercel-da \`GROQ_API_KEY\` muhit o'zgaruvchisi to'g'ri o'rnatilganini va tarmoq ulanishingizni tekshiring.`);
            }
        }

        // Trigger Event Listeners
        btnSend.addEventListener('click', sendMessage);

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initialize App
        showWelcomeMessage();
    </script>
</body>
</html>
