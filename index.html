<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asilbek AI - Sun'iy Intellekt</title>
    
    <!-- Outfit Font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Marked.js Markdown Parser CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Link to Modularized External CSS Stylesheet -->
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <h2>Asilbek AI</h2>
                <p>Llama 3.1 & Vercel</p>
            </div>
            
            <div class="premium-card">
                <b>🇺🇿 Til:</b> O'zbek tili<br>
                <b>🗣️ Shaxsiyat:</b> Virtual yordamchi<br>
                <b>🌍 Platforma:</b> Vercel Edge Serverless
            </div>
            
            <div class="settings-title">⚙️ Sozlamalar</div>
            
            <div class="control-group">
                <label class="control-label" for="modelSelect">SI Modeli</label>
                <select class="select-input" id="modelSelect">
                    <option value="llama-3.1-8b-instant" selected>llama-3.1-8b-instant (Tezkor)</option>
                    <option value="llama-3.1-70b-versatile">llama-3.1-70b-versatile (Aqlli)</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label" for="tempRange">Kreativlik (Temperature)</label>
                <input class="range-input" type="range" id="tempRange" min="0" max="1" step="0.1" value="0.7">
                <div class="range-value">
                    <span>Konservativ</span>
                    <span id="tempValue">0.7</span>
                    <span>Ijodiy</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label" for="tokenRange">Max Tokens</label>
                <input class="range-input" type="range" id="tokenRange" min="256" max="4096" step="128" value="2048">
                <div class="range-value">
                    <span>Qisqa</span>
                    <span id="tokenValue">2048</span>
                    <span>Uzun</span>
                </div>
            </div>

            <button class="btn-clear" id="btnClearChat">
                🗑️ Chatni tozalash
            </button>
        </aside>

        <!-- MAIN CHAT PANEL -->
        <main class="chat-area">
            <!-- Header -->
            <div class="header-container">
                <div class="header-info">
                    <button class="sidebar-toggle" id="sidebarToggle">☰</button>
                    <div class="header-logo">🤖</div>
                    <div class="header-text">
                        <h1>Asilbek AI</h1>
                        <p>O'zbek tilidagi aqlli sun'iy intellekt assistenti</p>
                    </div>
                </div>
                <div class="status-badge">
                    <div class="pulse-dot"></div>
                    Online
                </div>
            </div>

            <!-- Messages Viewport -->
            <div class="messages-container" id="messagesContainer">
                <!-- Messages will be injected here dynamically -->
            </div>

            <!-- Input Area -->
            <div class="input-container">
                <textarea class="chat-input" id="chatInput" placeholder="Asilbek AI ga savol bering..." rows="1"></textarea>
                <button class="btn-send" id="btnSend" disabled>➔</button>
            </div>
        </main>
    </div>

    <!-- Link to Modularized External Javascript Logic File -->
    <script src="static/js/app.js" defer></script>
</body>
</html>
